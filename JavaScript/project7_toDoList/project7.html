<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./project7.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>To DO List</title>
  </head>
  <body>
    <div class="container">
      <div class="heading">
        <h2>To-Do-List</h2>
      </div>
      <div class="input-section">
        <input
          type="text"
          class="input-field"
          placeholder="Enter Task"
          spellcheck="false"
        />
        <button class="add-btn">Add</button>
      </div>
      <div class="list-items"></div>
      <div class="filter">
        <button class="all-btn selected">All</button>
        <button class="active-btn">Active</button>
        <button class="completed-btn">Completed</button>
      </div>
      <div class="remaining-items"></div>
    </div>
    <script src="./project7.js"></script>
  </body>
</html>
